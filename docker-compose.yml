services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-overseer}
      POSTGRES_USER: ${POSTGRES_USER:-overseer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-overseer}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-overseer} -d ${POSTGRES_DB:-overseer}"]
      interval: 5s
      retries: 5

volumes:
  pgdata:
